version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Minor and patch updates come together, every major one in its own PR: a
  # major version may change the API (Javalin 7 broke the build in #57)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images of the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    ignore:
      # The JDK and JRE images follow the Java toolchain of build.gradle (21 LTS).
      # A new Java version is a change of the toolchain and both images
      # together, to an LTS release, not a Dependabot bump of the image alone.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
