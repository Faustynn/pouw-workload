name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect project
        id: detect
        run: |
          if [ -f gradlew ]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::gradlew does not exist yet, checks will be skipped."
          fi

      - uses: actions/setup-java@v6
        if: steps.detect.outputs.java == 'true'
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies and checks that gradle-wrapper.jar is an official one
      - uses: gradle/actions/setup-gradle@v6
        if: steps.detect.outputs.java == 'true'

      # build = compile + check (JUnit 5 tests and static checks such as Checkstyle or Spotless, once added)
      - name: Build and test
        if: steps.detect.outputs.java == 'true'
        run: ./gradlew build --no-daemon

      - name: Dockerfile lint (hadolint)
        if: hashFiles('Dockerfile') != ''
        run: docker run --rm -i ghcr.io/hadolint/hadolint < Dockerfile
